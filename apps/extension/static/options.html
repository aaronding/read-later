<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="optionsTitle"></title>
    <style>
      :root { color-scheme: light dark; --accent: #1f6f5c; }
      body { font: 15px/1.5 system-ui, sans-serif; max-width: 34rem; margin: 2rem auto; padding: 0 16px; }
      h1 { font-size: 1.4rem; display: flex; gap: 10px; align-items: center; }
      label { display: block; font-weight: 600; margin: 1rem 0 0.3rem; }
      input { box-sizing: border-box; width: 100%; font: inherit; padding: 0.5em 0.7em; border-radius: 8px; border: 1px solid #bbb; }
      .hint { color: #6b7280; font-size: 0.9rem; margin: 0.3rem 0 0; }
      button { margin-top: 1.2rem; font: inherit; padding: 0.5em 1.2em; border-radius: 999px; border: none; background: var(--accent); color: #fff; cursor: pointer; }
      #status { min-height: 1.5em; }
      #status.ok { color: var(--accent); }
      #status.error { color: #b42318; }
      @media (prefers-color-scheme: dark) { :root { --accent: #5cc2a4; } button { color: #0d1f1a; } input { border-color: #555; } }
      kbd { font: 0.85em ui-monospace, monospace; border: 1px solid #999; border-radius: 4px; padding: 0 4px; }
    </style>
  </head>
  <body>
    <h1><img src="icons/icon-48.png" width="32" height="32" alt="" /> <span class="app-name">Read Later</span></h1>
    <form id="settings">
      <label for="serverUrl" data-i18n="serverUrlLabel"></label>
      <input id="serverUrl" type="text" inputmode="url" placeholder="https://read.example.com" autocomplete="off" required />
      <p class="hint" data-i18n="serverUrlHint"></p>
      <label for="token" data-i18n="tokenLabel"></label>
      <input id="token" type="password" placeholder="rl_…" autocomplete="off" required />
      <p class="hint" data-i18n="tokenHint"></p>
      <button type="submit" data-i18n="saveAndCheck"></button>
      <p id="status" role="status"></p>
    </form>
    <p class="hint" id="usage"></p>
    <script type="module" src="options.js"></script>
  </body>
</html>

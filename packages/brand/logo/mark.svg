<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The logo as the app shows it, in its header and on the sign-in page: 冊, the
       character for a book of bamboo slips bound with cord, in the manner of a
       bronze inscription. Four slips, the cord closing in a half circle past the
       last one, and the longest slip, a bookmark with a notched end, in cinnabar:
       pale strokes on ink, like an ink rubbing with a red mark. mark-dark.svg is
       the version for dark themes. The icons outside the app, from icon.svg, are
       cinnabar instead. -->
  <rect width="512" height="512" rx="112" fill="#2b2723"/>
  <g fill="none" stroke="#ece3cf" stroke-width="30" stroke-linecap="round">
    <path d="M160 136V378M272 154V354M328 110V390"/>
    <path d="M120 218H350A44 44 0 0 1 350 306H120" stroke-width="26"/>
  </g>
  <path d="M216 78A12 12 0 0 1 228 90V427.7L216 413.3L204 427.7V90A12 12 0 0 1 216 78Z" fill="#c8412f" stroke="#c8412f" stroke-width="6" stroke-linejoin="round"/>
</svg>

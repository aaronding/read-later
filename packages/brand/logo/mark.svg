<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The logo: a bookmark ribbon hangs from the top edge, folds back at 45 degrees
       and runs to the right, showing its pale green back and ending in a notch.
       The lines of text on the long arm are the article, and the one line on the
       folded arm is its gist. mark-dark.svg is the version for dark themes, and
       mark-small.svg the plain ribbon for 16 and 32 px. -->

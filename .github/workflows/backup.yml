# Nightly pg_dump of the production database to Cloudflare R2.
# Set up in docs/setup/r2-backups.md. Until the secrets exist, the job only
# prints a notice, so it never fails before setup.
name: Nightly database backup

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC every day
  workflow_dispatch: # "Run workflow" button for a manual backup

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 doesn't accept every checksum header newer AWS CLIs send by default.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      # pg_dump must be at least the server's Postgres version.
      PG_IMAGE: ${{ vars.PG_DUMP_IMAGE || 'postgres:17-alpine' }}
    steps:
      - name: Check that backups are configured
        id: check
        run: |
          missing=""
          for name in DATABASE_URL R2_ACCOUNT_ID R2_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::notice::Backups are not set up yet (missing:$missing). See docs/setup/r2-backups.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dump the database
        if: steps.check.outputs.configured == 'true'
        run: |
          docker run --rm -e DATABASE_URL "$PG_IMAGE" \
            sh -c 'pg_dump --format=custom --compress=9 --no-owner --no-privileges "$DATABASE_URL"' > backup.dump
          test -s backup.dump
          echo "Dump size: $(du -h backup.dump | cut -f1)"

      - name: Upload to R2
        if: steps.check.outputs.configured == 'true'
        run: |
          name="readlater-$(date -u +%Y-%m-%dT%H%MZ).dump"
          aws s3 cp backup.dump "s3://$R2_BUCKET/daily/$name" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --only-show-errors
          echo "Uploaded daily/$name"
